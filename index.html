<title>Pas à pas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: a classroom "activity board" — sticky header with theme chips, a grid of activity tiles, one focused activity at a time */
:root {
  --paper: #F3F6F9;
  --card: #FFFFFF;
  --ink: #1D2A3A;
  --muted: #5B6B7E;
  --line: #D3DCE6;
  --accent: #C8102E;      /* maple red, used sparingly */
  --teal: #0F7C7A;
  --teal-soft: #DCEFEE;
  --sun: #F2B705;
  --ok: #23885A;
  --ok-soft: #DDF3E7;
  --warn-soft: #FDECEC;
  --guide: #C9D3DE;
  --focus: #1F6FEB;
  --sheet: #FFFFFF;
  --sheet-ink: #1D2A3A;
  --shadow: 0 1px 2px rgba(29,42,58,.06), 0 6px 18px rgba(29,42,58,.06);
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
  --base: 17px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161E; --card: #18222D; --ink: #E5ECF4; --muted: #9AAABC; --line: #2B3948;
    --accent: #FF5C70; --teal: #43C2BE; --teal-soft: #173634; --sun: #F5C842;
    --ok: #4CC38A; --ok-soft: #173327; --warn-soft: #3A1E22; --guide: #3A4A5C; --focus: #6EA8FF;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10161E; --card: #18222D; --ink: #E5ECF4; --muted: #9AAABC; --line: #2B3948;
  --accent: #FF5C70; --teal: #43C2BE; --teal-soft: #173634; --sun: #F5C842;
  --ok: #4CC38A; --ok-soft: #173327; --warn-soft: #3A1E22; --guide: #3A4A5C; --focus: #6EA8FF;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}
html { font-size: var(--base); }
html.big { --base: 21px; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
@media (max-width: 640px) { header.top { position: static !important; } }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; letter-spacing: .2px; }
.brand small { display: block; font-size: .78rem; color: var(--muted); margin-top: -6px; letter-spacing: .3px; }
.bar .spacer { flex: 1; }
.iconbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; font-weight: 700; }
.iconbtn[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--ink); }

.themes { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 12px; scrollbar-width: thin; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 700; white-space: nowrap; }
.chip .mini { width: 30px; height: 30px; display: grid; place-items: center; font-size: 20px; }
.chip[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-soft); }
.chip .mini .swatch { width: 22px; height: 22px; }
.chip .mini .numeral { font-size: 18px; }

.settings { display: grid; gap: 10px; padding-block: 4px 14px; }
.settings .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { color: var(--muted); font-size: .9rem; }

main { padding-block: 22px 60px; }

/* home */
.hello { display: grid; gap: 6px; margin-bottom: 18px; }
.hello h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; }
.hello p { margin: 0; color: var(--muted); max-width: 62ch; }
.hello .now { color: var(--ink); font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.tile { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); transition: transform .15s ease, border-color .15s ease; }
.tile:hover { transform: translateY(-2px); border-color: var(--teal); }
.tile .ic { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; }
.tile h3 { font-size: 1.25rem; font-weight: 800; }
.tile p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; line-height: 1.35; }
.tile .uses { display: inline-block; margin-top: 6px; font-size: .75rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--teal); }

.videos { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(16px, 3vw, 24px); display: grid; gap: 16px; box-shadow: var(--shadow); scroll-margin-top: 150px; }
.vid-top { display: flex; gap: 14px; align-items: center; }
.vid-badge { flex: none; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
.videos h2 { font-size: 1.6rem; font-weight: 800; }
.videos p { margin: 2px 0 0; color: var(--muted); max-width: 60ch; }
.vid-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.vid-card { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); background: var(--paper); }
.vid-card:hover { border-color: var(--accent); }
.vid-card .emoji { font-size: 32px; }
.vid-card b { display: block; font-size: 1.05rem; }
.vid-card small { display: block; color: var(--muted); font-size: .88rem; line-height: 1.3; }
.btn.vid-btn { justify-self: start; background: var(--accent); border-color: var(--accent); color: #fff; text-decoration: none; }
a.iconbtn { text-decoration: none; color: var(--ink); }
@media (max-width: 480px) { .bar .iconbtn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .bar .iconbtn { padding: 10px 12px; } }
details.teacher { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; }
details.teacher summary { font-weight: 700; cursor: pointer; }
details.teacher .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-top: 10px; }
details.teacher h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.05rem; }
details.teacher ul { margin: 0; padding-left: 1.1em; }
details.teacher p, details.teacher li { color: var(--muted); font-size: .92rem; max-width: 65ch; }

/* activity shell */
.act-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 700; text-decoration: none; color: var(--ink); }
.act-head h1 { font-size: clamp(1.5rem, 3.5vw, 2rem); font-weight: 800; }
.gseg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.gseg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 700; min-height: 40px; }
.gseg button b { font-family: var(--font-display); font-size: 1.1em; margin-right: 4px; }
.gseg button[aria-pressed="true"] { background: var(--teal); color: var(--card); }
.act-head .how { flex-basis: 100%; margin: 0; color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(14px, 3vw, 28px); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 20px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 1.05rem; }
.btn.main { background: var(--teal); border-color: var(--teal); color: #fff; }
:root[data-theme="dark"] .btn.main { color: #0D1B1E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.main { color: #0D1B1E; } }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }

/* pictures */
.emoji { font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; line-height: 1; }
.swatch { display: inline-block; width: 1em; height: 1em; border-radius: 50%; background: var(--sw); border: 3px solid var(--sheet-ink); box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); }
.numeral { font-family: var(--font-display); font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.week { display: inline-grid; grid-template-columns: repeat(7, 1fr); gap: .08em; font-size: .3em; }
.week span { display: grid; place-items: center; width: 1.5em; height: 1.8em; border-radius: .3em; border: 2px solid var(--line); font-family: var(--font-display); font-weight: 800; color: var(--muted); background: var(--card); }
.week span.on { background: var(--sun); border-color: var(--sun); color: #1D2A3A; transform: translateY(-.2em); }

.word { font-family: var(--font-body); font-weight: 700; letter-spacing: .5px; }

/* flashcard */
.flash { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 18px; text-align: center; }
.flash .big { font-size: clamp(110px, 22vw, 180px); min-height: 1.1em; display: grid; place-items: center; }
.flash .big .week { font-size: clamp(110px, 22vw, 180px); }
.flash .word { font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.1; }
.flash .word.hidden-word { visibility: hidden; }
.say3 { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.say3 .lbl { font-weight: 700; color: var(--muted); }
.dot3 { width: 46px; height: 46px; border-radius: 50%; border: 3px dashed var(--teal); background: transparent; font-weight: 800; font-family: var(--font-display); font-size: 1.2rem; color: var(--teal); }
.dot3.on { background: var(--teal); border-style: solid; color: var(--card); }
.reveal { min-height: 1.1em; }

/* choices */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; width: 100%; max-width: 720px; }
.choice { aspect-ratio: 1; max-width: 100%; border-radius: var(--r); border: 3px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: clamp(64px, 12vw, 96px); transition: transform .15s, opacity .2s; }
.choice .week { font-size: clamp(64px, 12vw, 96px); }
.choice.good { border-color: var(--ok); background: var(--ok-soft); }
.choice.nope { opacity: .35; }

.feedback { min-height: 2.2em; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; text-align: center; }
.feedback.ok { color: var(--ok); }
.feedback.try { color: var(--accent); }

/* trace */
.trace-top { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.trace-top .pic { font-size: 72px; }
.trace-top .pic .week { font-size: 72px; }
.canvas-wrap { position: relative; width: 100%; border-radius: 14px; background: var(--sheet); border: 2px solid var(--line); overflow: hidden; touch-action: none; }
.canvas-wrap::before { content: ""; position: absolute; left: 0; right: 0; top: 62%; border-top: 2px solid #E4B7BE; pointer-events: none; }
.canvas-wrap::after { content: ""; position: absolute; left: 0; right: 0; top: 30%; border-top: 2px dashed #CFE0EA; pointer-events: none; }
canvas#trace { display: block; width: 100%; touch-action: none; cursor: crosshair; }

/* colour by number */
.cbn { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
@media (max-width: 760px) { .cbn { grid-template-columns: 1fr; } }
.picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.sheet { background: var(--sheet); border: 2px solid var(--line); border-radius: 14px; padding: 8px; }
.sheet svg { display: block; width: 100%; height: auto; }
.sheet svg .reg { cursor: pointer; transition: fill .2s; }
.sheet svg .lab { font-family: var(--font-display); font-weight: 800; font-size: 17px; fill: #1D2A3A; paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; }
.side { display: grid; gap: 14px; }
.legend { display: grid; gap: 6px; }
.legend div { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; }
.legend .n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--line); font-family: var(--font-display); font-weight: 800; }
.legend div.done { opacity: .5; text-decoration: line-through; }
.palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pal { display: grid; justify-items: center; gap: 4px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 4px; font-size: .8rem; font-weight: 700; }
.pal .swatch { font-size: 30px; }
.pal[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--sun); }
.pal.hint { animation: hint 0.9s ease 2; }
@keyframes hint { 50% { transform: scale(1.12); box-shadow: 0 0 0 4px var(--accent); } }
.pal-names-off .pal span.nm { display: none; }

/* sort */
.pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 110px; padding: 10px; border: 2px dashed var(--line); border-radius: 14px; margin-bottom: 16px; }
.card { display: grid; justify-items: center; gap: 4px; min-width: 110px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); }
.card .p { font-size: 46px; line-height: 1; }
.card .p .week { font-size: 46px; }
.card .p .numeral { font-size: 42px; }
.card .w { font-weight: 700; font-size: 1rem; }
.card[aria-pressed="true"] { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun); transform: translateY(-3px); }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.bin { border: 3px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 12px; min-height: 180px; text-align: left; display: grid; align-content: start; gap: 10px; }
.bin h3 { font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
.bin h3 .p { font-size: 30px; }
.bin .in { display: flex; flex-wrap: wrap; gap: 8px; }
.bin .in .card { min-width: 0; padding: 6px 8px; }
.bin .in .card .p { font-size: 30px; }
.bin.ready { border-color: var(--sun); border-style: dashed; }

/* dots */
.dots-sheet { max-width: 620px; margin: 0 auto; }
.dots-sheet svg circle.dot { cursor: pointer; }
.dots-sheet svg .dlab { font-family: var(--font-display); font-weight: 800; fill: #1D2A3A; pointer-events: none; }
.dots-sheet svg .hit { fill: transparent; cursor: pointer; }

/* match */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; max-width: 640px; margin: 0 auto; }
.match .col { display: grid; gap: 10px; }
.mitem { min-height: 76px; border: 3px solid var(--line); border-radius: 14px; background: var(--card); display: grid; place-items: center; padding: 6px 10px; }
.mitem.pic { font-size: 48px; }
.mitem.pic .week { font-size: 44px; }
.mitem.pic .numeral { font-size: 44px; }
.mitem.wd { font-weight: 700; font-size: 1.2rem; text-align: center; }
.mitem[aria-pressed="true"] { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun); }
.mitem.paired { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 18%, var(--card)); }

.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.pop { animation: pop .45s ease; }
@keyframes pop { 40% { transform: scale(1.12); } }

.bravo { display: none; text-align: center; padding: 18px; border-radius: var(--r); background: var(--ok-soft); color: var(--ok); font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; margin-top: 16px; }
.bravo.show { display: block; }
.bravo .btn { margin-top: 8px; font-family: var(--font-body); font-size: 1rem; color: var(--ink); }

/* mémoire */
.mem { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 600px; margin: 0 auto; }
@media (max-width: 560px) { .mem { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mcard { aspect-ratio: 1; max-width: 100%; border-radius: 16px; border: 3px solid var(--line); background: var(--teal); position: relative; padding: 6px; }
.mcard .mback { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; color: var(--card); }
.mcard .face { display: none; height: 100%; align-content: center; justify-items: center; gap: 6px; }
.mcard .face .p { font-size: clamp(40px, 8vw, 64px); line-height: 1; }
.mcard .face .p .week { font-size: clamp(40px, 8vw, 60px); }
.mcard .face .w { font-weight: 700; font-size: .95rem; line-height: 1.15; text-align: center; }
.mcard.up { background: var(--card); }
.mcard.up .mback { display: none; }
.mcard.up .face { display: grid; }
.mcard.found { border-color: var(--ok); background: var(--ok-soft); }

/* bâtis la phrase */
.frame { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; font-family: var(--font-body); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.4rem); margin-bottom: 16px; text-align: center; }
.frame .slot { display: inline-flex; align-items: center; gap: 10px; min-width: 4.5em; min-height: 1.8em; justify-content: center; padding: 4px 16px; border: 3px dashed var(--teal); border-radius: 14px; color: var(--muted); }
.frame .slot.filled { border-style: solid; color: var(--ink); background: var(--teal-soft); }
.frame .slot .p { font-size: 1.2em; line-height: 1; }
.frame .slot .p .week { font-size: 1.1em; }
.pickgrid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

/* jacques a dit */
.simon { display: grid; gap: 4px; justify-items: center; }
.simon .who { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--teal); }
.simon .who.gone { visibility: hidden; }

/* qu'est-ce qui manque */
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; width: 100%; max-width: 640px; }
.mslot { display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 150px; border: 3px solid var(--line); border-radius: 16px; background: var(--card); padding: 10px; }
.mslot .p { font-size: 64px; line-height: 1; }
.mslot .p .week { font-size: 58px; }
.mslot .w { font-weight: 700; text-align: center; }
.mslot.empty { border-style: dashed; border-color: var(--accent); color: var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 3rem; }
#stage.blink .mgrid { opacity: 0; transition: opacity .3s; }

/* lettre manquante */
.spell { font-size: clamp(2.2rem, 8vw, 3.8rem); letter-spacing: .06em; }
.spell .gap { display: inline-block; min-width: .75em; border-bottom: 5px solid var(--accent); color: var(--accent); text-align: center; }
.spell .gap.filled { color: var(--ok); border-color: var(--ok); }
.letters { display: flex; gap: 14px; justify-content: center; }
.lt { width: 84px; height: 84px; border-radius: 18px; border: 3px solid var(--line); background: var(--card); font-family: var(--font-body); font-weight: 700; font-size: 2.4rem; }
.lt.good { border-color: var(--ok); background: var(--ok-soft); }
.lt.nope { opacity: .35; }

/* enregistre-toi */
.recrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.mic.live { background: var(--accent); border-color: var(--accent); animation: pulse 1.2s ease infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); } }

html.calm *, html.calm *::before, html.calm *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

/* ------------------------------------------------------------------ speech */
let VOICE = null;
const hasSpeech = "speechSynthesis" in window;
function pickVoice() {
  if (!hasSpeech) { $("#voiceNote").textContent = "Ce navigateur ne lit pas les mots à voix haute. Essaie Chrome ou Edge."; return; }
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v => /^fr[-_]CA/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
  $("#voiceNote").textContent = VOICE
    ? "Voix : " + VOICE.name + " (" + VOICE.lang + ")"
    : (vs.length ? "Aucune voix française sur cet appareil. Ajoute une voix française dans les réglages de l'ordinateur." : "Recherche d'une voix française…");
}
function speak(text, slow) {
  if (!hasSpeech) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE ? VOICE.lang : "fr-CA";
    if (VOICE) u.voice = VOICE;
    u.rate = (slow || S.slow) ? 0.55 : 0.9;
    clearTimeout(speak._t);
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      // iOS Safari drops an utterance queued right after cancel(), so wait a moment
      speechSynthesis.cancel();
      speak._t = setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) {} }, 180);
    } else {
      speechSynthesis.speak(u);
    }
  } catch (e) {}
}
if (hasSpeech) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; setTimeout(pickVoice, 800); }
else pickVoice();

  $("#themes").innerHTML = THEMES.map(t =>
    '<button class="chip" data-theme="' + t.id + '" aria-pressed="' + (t.id === S.theme) + '"><span class="mini">' + pic(t.words[t.id === "nombres" ? 5 : 0]) + "</span>" + esc(t.name) + "</button>"
  ).join("");
}
$("#themes").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  S.theme = b.dataset.theme; store.set("theme", S.theme);
  $$(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.theme === S.theme));
  route();
});
function applySettings() {
  document.documentElement.classList.toggle("big", S.big);
  document.documentElement.classList.toggle("calm", S.calm);
  $("#optBig").setAttribute("aria-pressed", S.big);
  $("#optSlow").setAttribute("aria-pressed", S.slow);
  $("#optCalm").setAttribute("aria-pressed", S.calm);
}
$("#setBtn").addEventListener("click", () => {
  const p = $("#settings"); p.hidden = !p.hidden; $("#setBtn").setAttribute("aria-expanded", !p.hidden); if (!p.hidden) pickVoice();
});
[["#optBig","big"],["#optSlow","slow"],["#optCalm","calm"]].forEach(([sel, k]) =>
  $(sel).addEventListener("click", () => { S[k] = !S[k]; store.set(k, S[k]); applySettings(); if (k === "big") route(); }));
$("#optTest").addEventListener("click", () => speak("Bonjour ! Je m'appelle la voix française."));

function shell(id, how, themed = true, gendered = themed && hasGender(theme())) {

/* --- 1. Écoute et répète ------------------------------------------------ */
function ecoute() {
  const act = shell("ecoute", "Touche le haut-parleur. Écoute. Dis le mot à voix haute et touche un rond chaque fois.");
  const words = theme().words; let i = Math.min(IDX.ecoute || 0, words.length - 1);
  function draw(auto) {
    const w = words[i]; IDX.ecoute = i;
    act.innerHTML =
      '<div class="flash"><div class="big">' + pic(w) + '</div><div class="word">' + esc(FR(w)) + "</div>" +
      '<div class="btns"><button class="btn main" id="play">🔊 Écoute</button></div>' +
      '<div class="say3"><span class="lbl">Dis-le 3 fois :</span>' + [1,2,3].map(n => '<button class="dot3" aria-label="Fois ' + n + '">' + n + "</button>").join("") + "</div>" +
      '<div class="btns"><button class="btn" id="prev">← Avant</button><span class="counter" style="align-self:center">' + (i + 1) + " / " + words.length + '</span><button class="btn" id="next">Après →</button></div>' +
      '<div class="feedback ok" id="fb"></div></div>';
    $("#play", act).onclick = () => speak(FR(w));
    $$(".dot3", act).forEach(d => d.onclick = () => {
      d.classList.toggle("on"); flash(d, "pop");
      if ($$(".dot3.on", act).length === 3) { $("#fb", act).textContent = praise(); }
    });
    $("#prev", act).onclick = () => { i = (i - 1 + words.length) % words.length; draw(true); };
    $("#next", act).onclick = () => { i = (i + 1) % words.length; draw(true); };
    if (auto) speak(FR(w));
  }
  draw(false);
}

/* --- 2. Lis et répète --------------------------------------------------- */
function lis() {
  const act = shell("lis", "Lis le mot à voix haute. Ensuite, touche « Vérifie » pour voir l'image et entendre le mot.");
  let order = shuffle(theme().words), i = 0;
  function draw() {
    const w = order[i];
    act.innerHTML =
      '<div class="flash"><div class="word">' + esc(FR(w)) + '</div><div class="big reveal" id="rv" aria-live="polite"></div>' +
      '<div class="btns"><button class="btn main" id="chk">✔ Vérifie</button><button class="btn" id="again" hidden>🔊 Encore</button></div>' +
      '<div class="btns"><span class="counter" style="align-self:center">' + (i + 1) + " / " + order.length + '</span><button class="btn" id="next">Mot suivant →</button></div></div>';
    $("#chk", act).onclick = () => { $("#rv", act).innerHTML = pic(w); speak(FR(w)); $("#chk", act).hidden = true; $("#again", act).hidden = false; };
    $("#again", act).onclick = () => speak(FR(w));
    $("#next", act).onclick = () => { i++; if (i >= order.length) { order = shuffle(order); i = 0; } draw(); };
  }
  draw();
}

/* --- 3. Écoute et trouve ------------------------------------------------ */
function trouve() {
  const act = shell("trouve", "Écoute le mot. Touche la bonne image. Tu peux réécouter autant de fois que tu veux.");
  const words = theme().words; let round = 0;
  function draw() {
    const opts = pickN(words, Math.min(4, words.length)); const target = opts[Math.floor(Math.random() * opts.length)];
    act.innerHTML =
      '<div class="flash"><div class="btns"><button class="btn main" id="play">🔊 Écoute</button></div>' +
      '<div class="choices">' + opts.map((w, k) => '<button class="choice" data-k="' + k + '" aria-label="Image ' + (k + 1) + '">' + pic(w) + "</button>").join("") + "</div>" +
      '<div class="feedback" id="fb" aria-live="polite"></div><div class="btns"><button class="btn" id="next" hidden>Encore un →</button></div></div>';
    const fb = $("#fb", act);
    $("#play", act).onclick = () => speak(FR(target));
    $$(".choice", act).forEach(b => b.onclick = () => {
      const w = opts[+b.dataset.k];
      if (w === target) {
        b.classList.add("good"); flash(b, "pop"); fb.className = "feedback ok"; fb.innerHTML = praise() + " <span class='word'>" + esc(FR(w)) + "</span>";
        speak(FR(w)); $$(".choice", act).forEach(x => x.disabled = true); $("#next", act).hidden = false;
      } else {
        b.classList.add("nope"); flash(b, "shake"); b.disabled = true; fb.className = "feedback try"; fb.textContent = "Essaie encore !"; setTimeout(() => speak(FR(target)), 400);
      }
    });
    $("#next", act).onclick = () => { round++; draw(); };
    if (round > 0) speak(FR(target));
  }
  draw();
}

/* --- 4. Trace le mot ---------------------------------------------------- */
function trace() {
  const act = shell("trace", "Suis les lettres grises avec ton doigt ou la souris. Dis le mot pendant que tu écris.");
  const words = theme().words; let i = Math.min(IDX.trace || 0, words.length - 1); let strokes = []; let cur = null;
  act.innerHTML =
    '<div class="trace-top"><span class="pic" id="tpic"></span><span class="word" id="tword" style="font-size:2rem"></span><button class="btn" id="play">🔊 Écoute</button></div>' +
    '<div class="canvas-wrap" id="cw"><canvas id="trace" aria-label="Zone pour tracer le mot"></canvas></div>' +
    '<div class="btns" style="margin-top:14px"><button class="btn" id="prev">← Avant</button><button class="btn" id="clear">Efface</button><span class="counter" id="cnt" style="align-self:center"></span><button class="btn main" id="next">Mot suivant →</button></div>';
  const cv = $("#trace", act), ctx = cv.getContext("2d"), wrap = $("#cw", act);
  function tok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function size() {
    const r = window.devicePixelRatio || 1, w = wrap.clientWidth, h = Math.max(170, Math.min(300, w * 0.36));
    cv.width = Math.round(w * r); cv.height = Math.round(h * r); cv.style.height = h + "px";
    ctx.setTransform(r, 0, 0, r, 0, 0); redraw();
  }
  function guide() {
    const w = wrap.clientWidth, h = cv.height / (window.devicePixelRatio || 1), text = FR(words[i]);
    let fs = h * 0.62; ctx.font = "700 " + fs + "px Andika, sans-serif";
    const tw = ctx.measureText(text).width; if (tw > w * 0.9) fs *= (w * 0.9) / tw;
    ctx.font = "700 " + fs + "px Andika, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    const y = h * 0.62;
    ctx.fillStyle = "#E3E9F0"; ctx.fillText(text, w / 2, y);
    ctx.setLineDash([6, 7]); ctx.lineWidth = 2.5; ctx.strokeStyle = "#7D8FA3"; ctx.strokeText(text, w / 2, y); ctx.setLineDash([]);
  }
  function redraw() {
    const w = wrap.clientWidth, h = cv.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h); guide();
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = tok("--teal") || "#0F7C7A"; ctx.lineWidth = Math.max(8, h * 0.05);
    strokes.forEach(s => { ctx.beginPath(); s.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (s.length === 1) ctx.lineTo(s[0][0] + 0.1, s[0][1]); ctx.stroke(); });
  }
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); redraw(); });
  cv.addEventListener("pointermove", e => { if (!cur) return; cur.push(pt(e)); redraw(); });
  const end = () => { cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  function show(auto) {
    const w = words[i]; strokes = []; IDX.trace = i;
    $("#tpic", act).innerHTML = pic(w); $("#tword", act).textContent = FR(w); $("#cnt", act).textContent = (i + 1) + " / " + words.length;
    redraw(); if (auto) speak(FR(w));
  }
  $("#play", act).onclick = () => speak(FR(words[i]));
  $("#clear", act).onclick = () => { strokes = []; redraw(); };
  $("#prev", act).onclick = () => { i = (i - 1 + words.length) % words.length; show(true); };
  $("#next", act).onclick = () => { i = (i + 1) % words.length; show(true); };
  if (window.__papResize) window.removeEventListener("resize", window.__papResize);
  window.__papResize = size; window.addEventListener("resize", size, { passive: true });
  (document.fonts && document.fonts.load ? document.fonts.load("700 40px Andika") : Promise.resolve()).catch(() => {}).then(() => { size(); show(false); });
}

function colorie() {
  const act = shell("colorie", "Choisis une couleur, puis touche une partie du dessin avec ce numéro. Regarde la liste : chaque numéro a une couleur.", false, true);
  let pi = 0, sel = null, names = true;
  function draw() {
    const P = PICS[pi]; sel = null;
    const used = [...new Set(Object.values(P.legend))];
    act.innerHTML =
      '<div class="picker" role="group" aria-label="Dessins">' + PICS.map((p, k) => '<button class="iconbtn" data-p="' + k + '" aria-pressed="' + (k === pi) + '">' + esc(p.name) + "</button>").join("") + "</div>" +
      '<div class="cbn"><div class="sheet"><svg viewBox="0 0 400 300" role="img" aria-label="Dessin à colorier : ' + esc(P.name) + '">' +
        P.regions.map((r, k) => r.s.replace(/^<(\w+)/, '<$1 class="reg" data-k="' + k + '" fill="#FFFFFF" stroke="#1D2A3A" stroke-width="2.5"')).join("") +
        P.regions.map((r, k) => '<text class="lab" data-k="' + k + '" x="' + r.l[0] + '" y="' + r.l[1] + '" text-anchor="middle">' + r.n + "</text>").join("") +
      "</svg></div>" +
      '<div class="side"><div class="legend" id="leg">' + Object.keys(P.legend).map(n => '<div data-n="' + n + '"><span class="n">' + n + "</span>" + NUMS[n] + ' → <b class="word">' + colName(P.legend[n]) + "</b></div>").join("") + "</div>" +
      '<div class="palette' + (names ? "" : " pal-names-off") + '" id="pal">' + used.map(c => '<button class="pal" data-c="' + c + '" aria-pressed="false" aria-label="' + colName(c) + '"><span class="swatch" style="--sw:' + COLORS[c] + '"></span><span class="nm">' + colName(c) + "</span></button>").join("") + "</div>" +
      '<button class="iconbtn" id="names" aria-pressed="' + names + '">Noms des couleurs</button>' +
      '<div class="feedback" id="fb" aria-live="polite"></div></div></div>' +
      '<div class="bravo" id="bravo">Bravo ! C\'est ' + esc(P.name) + ' !<br><button class="btn" id="again">Un autre dessin →</button></div>';
    const done = new Set();
    const fb = $("#fb", act);
    $$(".picker .iconbtn", act).forEach(b => b.onclick = () => { pi = +b.dataset.p; draw(); });
    $("#names", act).onclick = () => { names = !names; $("#pal", act).classList.toggle("pal-names-off", !names); $("#names", act).setAttribute("aria-pressed", names); };
    $$(".pal", act).forEach(b => b.onclick = () => {
      sel = b.dataset.c; $$(".pal", act).forEach(x => x.setAttribute("aria-pressed", x === b)); speak(colName(sel)); fb.textContent = "";
    });
    $$(".reg", act).forEach(el => el.addEventListener("click", () => {
      const k = +el.dataset.k, r = P.regions[k], want = P.legend[r.n];
      if (done.has(k)) return;
      if (!sel) { fb.className = "feedback try"; fb.textContent = "Choisis une couleur d'abord."; return; }
      if (sel === want) {
        el.setAttribute("fill", COLORS[want]); done.add(k);
        const lab = $('.lab[data-k="' + k + '"]', act); if (lab) lab.style.opacity = ".25";
        fb.className = "feedback ok"; fb.textContent = praise(); speak(NUMS[r.n] + ", " + colName(want));
        const left = P.regions.filter((x, j) => x.n === r.n && !done.has(j)).length;
        if (!left) $('#leg [data-n="' + r.n + '"]', act).classList.add("done");
        if (done.size === P.regions.length) { $("#bravo", act).classList.add("show"); speak("Bravo ! C'est " + P.name + " !"); }
      } else {
        fb.className = "feedback try"; fb.textContent = "Numéro " + NUMS[r.n] + " : " + colName(want);
        speak("Numéro " + NUMS[r.n] + " : " + colName(want));

    const lab = (p, k) => { const dx = p[0] - cx, dy = p[1] - cy, d = Math.hypot(dx, dy) || 1; const off = words ? 7 : 5; return [p[0] + dx / d * off, p[1] + dy / d * off + 1.3]; };

        (SH.stem ? '<path id="stem" d="M50 74 L50 96" stroke="#1D2A3A" stroke-width="2.4" stroke-linecap="round" opacity="0"/>' : "") +
        '<polyline id="line" points="" fill="none" stroke="#0F7C7A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
        P.map((p, k) => '<circle class="hit" data-k="' + k + '" cx="' + p[0] + '" cy="' + p[1] + '" r="4.5"/>').join("") +
        P.map((p, k) => '<circle class="dot" data-k="' + k + '" cx="' + p[0] + '" cy="' + p[1] + '" r="1.9" fill="#1D2A3A"/>').join("") +

/* --- 13. La lettre manquante --------------------------------------------- */
const ALPHA = "abcdefghijklmnopqrstuvwxyz";
const plain = ch => ch.normalize("NFD").replace(/[̀-ͯ]/g, "");
function lettre() {
  const act = shell("lettre", "Regarde l'image et écoute le mot. Quelle lettre manque ? Touche la bonne lettre.");
  let order = shuffle(theme().words), i = 0;
  function draw() {
    const w = order[i], word = FR(w);
    const art = (word.match(/^(le |la |les |l'|l’|un |une |des )/i) || [""])[0].length;
    const idxs = [...word].map((ch, k) => ({ch, k})).filter(o => /\p{L}/u.test(o.ch) && o.k >= art && (art > 0 || o.k > 0));
    const pickFrom = idxs.length ? idxs : [...word].map((ch, k) => ({ch, k})).filter(o => /\p{L}/u.test(o.ch));
    const hole = pickFrom[Math.floor(Math.random() * pickFrom.length)];
    const right = hole.ch.toLowerCase();
    const pool = ALPHA.split("").filter(c => c !== plain(right));
    const opts = shuffle([right, ...pickN(pool, 2)]);
    const shown = [...word].map((ch, k) => k === hole.k ? '<span class="gap" id="gap">_</span>' : esc(ch)).join("");
    act.innerHTML =
      '<div class="flash"><div class="big">' + pic(w) + '</div><div class="word spell">' + shown + "</div>" +
      '<div class="btns"><button class="btn" id="play">🔊 Écoute</button></div>' +
      '<div class="letters">' + opts.map(c => '<button class="lt" data-c="' + c + '">' + c + "</button>").join("") + "</div>" +
      '<div class="feedback" id="fb" aria-live="polite"></div><div class="btns"><span class="counter" style="align-self:center">' + (i + 1) + " / " + order.length + '</span><button class="btn" id="next">Mot suivant →</button></div></div>';
    const fb = $("#fb", act);
    $("#play", act).onclick = () => speak(word);
    $$(".lt", act).forEach(b => b.onclick = () => {
      if (b.dataset.c === right) {
        const g = $("#gap", act); g.textContent = hole.ch; g.classList.add("filled"); flash(g, "pop");
        b.classList.add("good"); $$(".lt", act).forEach(x => x.disabled = true);
        fb.className = "feedback ok"; fb.textContent = praise(); speak(word);
      } else { b.disabled = true; b.classList.add("nope"); flash(b, "shake"); fb.className = "feedback try"; fb.textContent = "Essaie une autre lettre !"; }
    });
    $("#next", act).onclick = () => { i++; if (i >= order.length) { order = shuffle(order); i = 0; } draw(); };
  }
  draw();
}

/* --- 14. Enregistre-toi --------------------------------------------------- */
let REC = {stream: null, url: null};
function stopMic() { try { if (REC.stream) REC.stream.getTracks().forEach(t => t.stop()); } catch (e) {} REC.stream = null; }
function enregistre() {
  const act = shell("enregistre", "Écoute le mot. Touche le micro et dis le mot. Ensuite, écoute ta voix. Ta voix reste sur cet appareil.");
  const words = theme().words; let i = 0, rec = null, chunks = [], stopT = null;
  const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  function draw() {
    const w = words[i];
    if (REC.url) { try { URL.revokeObjectURL(REC.url); } catch (e) {} REC.url = null; }
    act.innerHTML =
      '<div class="flash"><div class="big">' + pic(w) + '</div><div class="word">' + esc(FR(w)) + "</div>" +
      '<div class="recrow"><button class="btn" id="model">🔊 Le modèle</button>' +
      '<button class="btn main mic" id="mic" aria-pressed="false">🎙️ Enregistre</button>' +
      '<button class="btn" id="mine" disabled>▶️ Ma voix</button></div>' +
      '<div class="feedback" id="fb" aria-live="polite"></div>' +
      '<div class="btns"><button class="btn" id="prev">← Avant</button><span class="counter" style="align-self:center">' + (i + 1) + " / " + words.length + '</span><button class="btn" id="next">Après →</button></div></div>';
    const fb = $("#fb", act), mic = $("#mic", act), mine = $("#mine", act);
    $("#model", act).onclick = () => speak(FR(w));
    mine.onclick = () => { if (REC.url) { try { new Audio(REC.url).play(); } catch (e) {} } };
    if (!canRec) { mic.disabled = true; fb.className = "feedback try"; fb.textContent = "Le micro n'est pas disponible ici."; }
    mic.onclick = async () => {
      if (rec && rec.state === "recording") { rec.stop(); return; }
      try {
        if (!REC.stream) REC.stream = await navigator.mediaDevices.getUserMedia({audio: true});
        chunks = []; rec = new MediaRecorder(REC.stream);
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          clearTimeout(stopT); mic.classList.remove("live"); mic.setAttribute("aria-pressed", "false"); mic.textContent = "🎙️ Encore";
          if (REC.url) { try { URL.revokeObjectURL(REC.url); } catch (e) {} }
          REC.url = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || "audio/webm"}));
          mine.disabled = false; fb.className = "feedback ok"; fb.textContent = "Écoute ta voix, puis le modèle.";
          try { new Audio(REC.url).play(); } catch (e) {}
        };
        rec.start(); mic.classList.add("live"); mic.setAttribute("aria-pressed", "true"); mic.textContent = "⏹️ Arrête";
        fb.className = "feedback"; fb.textContent = "Je t'écoute…";
        stopT = setTimeout(() => { if (rec && rec.state === "recording") rec.stop(); }, 6000);
      } catch (e) {
        mic.disabled = true; fb.className = "feedback try"; fb.textContent = "Le micro n'est pas disponible ici.";
      }
    };
    $("#prev", act).onclick = () => { i = (i - 1 + words.length) % words.length; draw(); speak(FR(words[i])); };
    $("#next", act).onclick = () => { i = (i + 1) % words.length; draw(); speak(FR(words[i])); };
  }
  draw();
}

const VIEWS = { ecoute, lis, trouve, trace, colorie, trie, points, associe, memoire, phrase, jacques, manque, lettre, enregistre };
function route(keep) {
  const id = (location.hash || "").slice(1);
  if (!keep) { IDX.ecoute = 0; IDX.trace = 0; }
  if (id !== "enregistre") stopMic();
  if (hasSpeech) try { speechSynthesis.cancel(); } catch (e) {}
  (VIEWS[id] || home)();
  if (id === "videos") { const v = $("#videos-sec"); if (v) v.scrollIntoView({block: "start"}); }
  else if (!keep) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => route());
renderThemes(); applySettings(); route();
})();
</script>
